<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betta fish in ASCII</title>
<style>
  html,body{margin:0;height:100%;background:#03070d;color:#6f8fa0;font-family:ui-monospace,Menlo,Consolas,monospace}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  #c{display:block;max-width:100vw;cursor:pointer}
  p{margin:10px 0 0;font-size:12px;opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<p>tap the fish to replay</p>
<script>
// ====== CHANGE YOUR NAME HERE (or share a link ending in ?name=YourName) ======
const NAME = new URLSearchParams(location.search).get('name') || 'KOUSHIK';
// ==============================================================================

const COLS = 100, K = COLS / 90, ROWS = Math.round(140 * K / 2);
const DURATION = 9000;
const RAMP = ' .:-=+*#%@';

const off = document.createElement('canvas');
off.width = COLS; off.height = ROWS;
const o = off.getContext('2d', { willReadFrequently: true });

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let cw, rh, fs;
function resize() {
  const w = Math.min(window.innerWidth, 560);
  const dpr = window.devicePixelRatio || 1;
  cw = w / COLS; rh = cw * 2; fs = cw / 0.6;
  cv.style.width = w + 'px'; cv.style.height = (rh * ROWS) + 'px';
  cv.width = w * dpr; cv.height = rh * ROWS * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rad = d => d * Math.PI / 180;
const parts = Array.from({ length: 40 }, (_, i) => ({
  a: i * 2.4, r: 40 + (i * 37 % 45), s: 0.6 + (i % 5) * 0.2
}));

function ray(bx, by, ang, len, bend, color, w) {
  const tx = bx + Math.cos(ang) * len, ty = by + Math.sin(ang) * len;
  const cx = bx + Math.cos(ang - 0.28) * len * 0.55 + bend * 0.4;
  const cy = by + Math.sin(ang - 0.28) * len * 0.55;
  o.strokeStyle = color; o.lineWidth = w;
  o.beginPath(); o.moveTo(bx, by); o.quadraticCurveTo(cx, cy, tx + bend, ty); o.stroke();
}

function drawFish(t, p) {
  const e = (a, b) => { const x = clamp((p - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
  const body = e(.08, .35), tail = e(.3, .7), fins = e(.55, .85), q = e(.05, .9);
  const sway = Math.sin(t * 1.6) * 0.05;
  o.fillStyle = '#000'; o.fillRect(0, 0, COLS, ROWS);
  o.save(); o.scale(K, K / 2);
  o.lineCap = 'round';

  // plankton spiralling in
  o.fillStyle = '#9fd';
  for (const s of parts) {
    const r = s.r * (1 - 0.8 * q), a = s.a + q * 4 * s.s + t * 0.2;
    o.globalAlpha = 0.7; o.fillRect(45 + Math.cos(a) * r, 78 + Math.sin(a) * r * 0.9, 1.4, 1.4);
  }
  o.globalAlpha = 1;

  // spark
  const sp = 1 - e(.1, .3);
  if (sp > 0) {
    const g = o.createRadialGradient(30, 78, 0, 30, 78, 9);
    g.addColorStop(0, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)');
    o.globalAlpha = sp; o.fillStyle = g; o.beginPath(); o.arc(30, 78, 9, 0, 7); o.fill(); o.globalAlpha = 1;
  }

  o.translate(52, 76); o.rotate(sway); o.translate(-52, -76);

  // tail veil
  if (tail > 0) {
    const N = 30;
    for (let i = 0; i < N; i++) {
      const u = i / (N - 1);
      const ang = rad(-90 + 175 * u) * tail - 0.15;
      const L = (28 + 20 * Math.sin(u * Math.PI)) * tail;
      const bend = Math.sin(t * 2 + i * 0.35) * 3 * tail;
      ray(52, 76, ang, L, bend, `hsl(${185 - 140 * u},75%,${36 + (i % 2) * 16}%)`, 2.6);
    }
  }
  // dorsal fin
  if (fins > 0) {
    for (let i = 0; i < 13; i++) {
      const L = (9 + 13 * Math.sin((i + 1) / 14 * Math.PI)) * fins;
      ray(24 + i * 2.2, 68, rad(-118 + i * 4.5), L, Math.sin(t * 2 + i) * 2, `hsl(${165 + i * 4},65%,${42 + (i % 2) * 14}%)`, 2.2);
    }
    // ventral fins
    for (let i = 0; i < 11; i++) {
      const L = (12 + i * 2.4) * fins;
      ray(28 + i * 2.2, 87, rad(62 - i * 3.5), L, Math.sin(t * 2.2 + i) * 3, `hsl(${150 - i * 6},60%,${42 + (i % 2) * 14}%)`, 2.2);
    }
    for (let i = 0; i < 6; i++)
      ray(25, 80, rad(15 + i * 9), 11 * fins, Math.sin(t * 5 + i), 'hsl(175,60%,60%)', 1.8);
  }
  // body
  if (body > 0) {
    const g = o.createLinearGradient(6, 0, 54, 0);
    g.addColorStop(0, '#2bb3c4'); g.addColorStop(.55, '#2c8f8a'); g.addColorStop(1, '#a8a43a');
    o.fillStyle = g;
    o.beginPath(); o.ellipse(30, 78, 24 * body, 11 * body, -0.05, 0, 7); o.fill();
    o.beginPath(); o.ellipse(16, 77, 11 * body, 9 * body, 0, 0, 7); o.fill();
    o.strokeStyle = 'rgba(255,255,255,.35)'; o.lineWidth = 1;
    for (let i = 0; i < 7; i++) {
      o.beginPath(); o.moveTo(26 + i * 4, 70 + i * 0.3); o.lineTo(26 + i * 4, 86 - i * 0.3); o.stroke();
    }
    if (body > .5) {
      o.fillStyle = '#000'; o.beginPath(); o.arc(14, 74, 2.6, 0, 7); o.fill();
      o.strokeStyle = '#fff'; o.lineWidth = 1; o.stroke();
    }
  }
  o.restore();

  // name, typed in under the fish
  const n = Math.floor(e(.88, 1) * NAME.length + 0.0001);
  if (n > 0) {
    o.save(); o.scale(K, K / 2);
    const size = Math.min(24, 82 / (NAME.length * 0.62));
    o.font = `bold ${size}px ui-monospace, Menlo, Consolas, monospace`;
    o.textBaseline = 'middle'; o.textAlign = 'left';
    const full = o.measureText(NAME).width;
    o.fillStyle = '#ffe9a8';
    o.fillText(NAME.slice(0, n), 45 - full / 2, 126);
    o.restore();
  }
}

function render() {
  const d = o.getImageData(0, 0, COLS, ROWS).data;
  ctx.fillStyle = '#03070d'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.font = `${fs}px ui-monospace, Menlo, Consolas, monospace`;
  ctx.textBaseline = 'top';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const i = (r * COLS + c) * 4, R = d[i], G = d[i + 1], B = d[i + 2];
    const lum = (0.3 * R + 0.59 * G + 0.11 * B) / 255;
    if (lum < 0.06) continue;
    const ch = RAMP[Math.min(RAMP.length - 1, Math.floor(Math.pow(lum, 0.8) * RAMP.length))];
    const m = 255 / Math.max(R, G, B, 1), f = Math.min(m, 1.4);
    ctx.fillStyle = `rgb(${Math.min(255, R * f)|0},${Math.min(255, G * f)|0},${Math.min(255, B * f)|0})`;
    ctx.fillText(ch, c * cw, r * rh);
  }
}

let start = performance.now(), last = 0;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - last < 33) return; last = now;
  const p = still ? 1 : clamp((now - start) / DURATION, 0, 1);
  drawFish(now / 1000, p); render();
}
cv.addEventListener('click', () => { start = performance.now(); });
requestAnimationFrame(loop);
</script>
</body>
</html>
