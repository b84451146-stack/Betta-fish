let finsDone = 0, letters = 0;

function ray(bx, by, ang, len, bend, c0, c1, w) {
  const tx = bx + Math.cos(ang) * len, ty = by + Math.sin(ang) * len;
  const cx = bx + Math.cos(ang - 0.3) * len * 0.55 + bend * 0.4, cy = by + Math.sin(ang - 0.3) * len * 0.55;
  const g = o.createLinearGradient(bx, by, tx, ty);
  g.addColorStop(0, c0); g.addColorStop(1, c1);
  o.strokeStyle = g; o.lineWidth = w;
  o.beginPath(); o.moveTo(bx, by); o.quadraticCurveTo(cx, cy, tx + bend, ty); o.stroke();
}
// rays appear one after another; each flashes white the moment it is finished
function fan(n, prog, t, make) {
  for (let i = 0; i < n; i++) {
    const k = prog * n - i;
    if (k <= 0) continue;
    if (k >= 1) finsDone++;
    const r = make(i, i / (n - 1)), grow = Math.min(1, k / 1.5);
    const flash = prog < 1 && k < 2;
    o.globalAlpha = flash ? 1 : 0.72 + 0.28 * Math.sin(t * 3 + i);
    ray(r.bx, r.by, r.ang, r.len * grow, r.bend, flash ? '#fff' : r.c0, flash ? '#fff' : r.c1, r.w || 2.2);
  }
  o.globalAlpha = 1;
}
